name: site-ci

on:
  push:
    paths:
      - 'site/**'
      # 站点 content 测试直接读 docs/facts.json；只改事实源的版本发布也必须触发，
      # 否则 /changelog 与 tests.python 会再次漂移（v6.4.1 → v6.4.2 就是这么红的）。
      - 'docs/facts.json'
      - '.github/workflows/site-ci.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'docs/facts.json'

permissions:
  contents: read

concurrency:
  group: site-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://ci.cf-solver.dev

      - name: CSP generate + verify
        run: |
          npm run csp
          npm run verify:csp

      - name: Content, tokens, contrast, SEO freshness
        run: |
          npm run test:content
          npm run test:tokens
          npm run test:contrast
          npm run test:seo

      - name: Browser install
        run: npx playwright install --with-deps chromium

      - name: Static server
        run: |
          nohup python3 -m http.server 3100 --directory out >/tmp/site-server.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:3100/ >/dev/null

      - name: Site verification (routes, hreflang, JSON-LD, axe, fallbacks)
        run: npm run verify:site

      - name: E2E (runtime errors, keyboard focus, reduced-motion, CLS)
        run: npm run test:e2e

      - name: Lighthouse (desktop)
        run: |
          export CHROME_PATH=$(node -e "console.log(require('@playwright/test').chromium.executablePath())")
          npx lhci autorun

      - name: Lighthouse (mobile, 记录基线)
        # 移动端性能受 runner 负载影响更大，性能项留 warn（不阻断），
        # 但 a11y/best-practices/SEO 仍是 error —— 这三类不该因设备而漂。
        run: |
          export CHROME_PATH=$(node -e "console.log(require('@playwright/test').chromium.executablePath())")
          npm run lighthouse:mobile

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-evidence
          path: |
            plans/证据/ui-v1/site-verify.json
            site/.lighthouseci/*.report.json
            site/.lighthouseci-mobile/*.report.json
          if-no-files-found: ignore