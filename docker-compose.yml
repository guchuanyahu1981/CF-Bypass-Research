# 多 worker + 共享缓存（v4.0 T-41 / 决策 C-3）
#
# 为什么是"多个同样的容器 + 一个共享卷"，而不是一个容器起多进程：
#   · 求解是串行的（Playwright sync API 绑线程），要吞吐只能加**进程**；
#   · 进程之间靠**共享 cache 目录**避免同一域重复求解（SQLite/WAL 支持多进程并发读单写）；
#   · 每个 worker 自己崩自己重启，互不影响 —— 这就是要的隔离。
#
# ✅ 状态：已在本机实测（v4.7 轮：3 worker 3s 就绪、6 端点全过、滚动 150 次请求 0 失败，
#    见 evidence/v47-container.md）。首次在新机器上跑，仍建议按 docs/部署-容器.md 的检查清单过一遍。
#
# ⚠️ 裸跑（不经过本文件的 `command`）时的唯一硬要求：**把 /data 挂成卷**。
#    镜像里设了 `CF_SOLVE_TOKEN_FILE=/data/.env`，`--token-file` 的默认值就取它
#    （2026-11-04 之前这个环境变量是死的，没人读 —— 当时裸跑会让 token 落进容器临时层，
#    每次重启重新生成 → 客户端旧 token 全部 401，且缓存密钥由 token 派生
#    (solver/cache.py:723) → 整个共享缓存被作废。现已修好并有 tests/test_bootstrap.py 守住）。
#    所以：`docker run -v solver-data:/data ...` 是必须的；不挂卷则上述后果照旧成立。

x-solver: &solver
  build:
    context: .
    args:
      # ⚠️ 显式跳过 UBO 插件预热（2026-11-04 实测）：
      #   camoufox 的插件源要访问 api.github.com 列 release，实测会 403 限流 / 404 抖动，
      #   而真下载很慢（容器内首启实测 40s 才 7%，全量分钟级）。构建期预热多次失败后
      #   Dockerfile 现在会**硬失败**（不再静默产出缺件镜像）。这里显式声明"知道代价"：
      #   跳过预热 ⇒ 每个新容器首启要现场下载几分钟（/health 期间 503）。
      #   要在离线/生产环境免除这几分钟，请在能稳定访问 GitHub 的网络里构建一次并复用
      #   /home/solver/.cache；或等上游插件源稳定后把这一行删掉（恢复严格预热）。
      PREWARM_ADDONS: "0"
  # 与 CHANGELOG / git tag 同步：`docker compose up` 会优先用这个 tag 的本地镜像，
  # 没有才 build。写死版本号是故意的 —— 否则"线上跑的是哪个镜像"永远说不清。
  image: cf-bypass-solver:6.4.2
  restart: unless-stopped
  volumes:
    - solver-data:/data
  environment:
    # 所有 worker 必须共用同一个 token 与同一个 cache 目录，否则缓存互不可见
    CF_SOLVE_TOKEN_FILE: /data/.env
    CF_CACHE_DIR: /data/cache
    CF_BROWSER_OS: windows      # 固定 persona：随机 UA 会让 IP 时区与指纹互相矛盾
  # 容器/端口映射下客户端地址是 docker 网关（如 172.17.0.1），不是 127.0.0.1 ——
  # 不放这行，`POST /shutdown`（滚动重启用）会一律 401。token 仍是第一道门。
  command: ["python", "solver/service.py", "--host", "0.0.0.0", "--port", "8878",
            "--cache-dir", "/data/cache", "--token-file", "/data/.env",
            "--allow-remote-shutdown"]
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8878/health', timeout=4).status==200 else 1)"]
    interval: 30s
    timeout: 5s
    start_period: 120s
    retries: 3

services:
  solver-1:
    <<: *solver
    container_name: cf-solver-1
    ports: ["8878:8878"]

  solver-2:
    <<: *solver
    container_name: cf-solver-2
    ports: ["8879:8878"]

  solver-3:
    <<: *solver
    container_name: cf-solver-3
    ports: ["8880:8878"]

volumes:
  solver-data:
